name: Label agent reports

# `memcap report` files issues through the reporter's own GitHub login, and
# people outside the repository cannot set labels. Label them here instead, so
# the README's agent-report link finds every one of them.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.body, '<!-- memcap-report:')
    runs-on: ubuntu-latest
    steps:
      - name: Add the agent-report label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --add-label agent-report
