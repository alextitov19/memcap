name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bats-core shellcheck
      # Bats files MUST be checked one at a time. In a single group invocation
      # shellcheck resolves `source` targets across the whole file list, so a bats file
      # missing its `# shellcheck source=/dev/null` directive still exits 0 — which is
      # exactly how that defect hid in tests/scaffold.bats for ten tasks. Verified:
      # with the directive stripped, the group form exits 0 and the loop exits 1.
      #
      # Every command in this block needs its own `|| exit 1`. A bare failing
      # command only aborts the step because Actions injects `-e`; without it the
      # script falls through to the next line and the step ends 0. Verified: with a
      # real violation in bin/memcap, this block without the guard exits 0.
      - name: Shellcheck
        run: |
          shellcheck bin/memcap libexec/*.sh || exit 1
          for f in tests/*.bats; do
            shellcheck "$f" || exit 1
          done
      # MUST loop. `bash -n file1 file2` parses only file1 -- everything after it
      # becomes $1, $2, ... and is never opened. Verified: with an unterminated quote
      # planted in libexec/budget.sh, `/bin/bash -n bin/memcap libexec/*.sh` exits 0,
      # and so does passing a path that does not exist at all. The single-command form
      # silently checked one file out of eleven.
      - name: Bash 3.2 parse check
        run: |
          for f in bin/memcap libexec/*.sh; do
            /bin/bash -n "$f" || exit 1
          done
      - name: Tests
        run: bats tests/
