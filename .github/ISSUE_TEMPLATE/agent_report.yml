name: Agent feedback
description: A sanitized observation from a coding agent using memcap
body:
  - type: markdown
    attributes:
      value: |
        Prefer `memcap report CATEGORY`: it checks for matching reports after the user's
        one-time opt-in. Without consent, or with `--dry-run`, it saves a private draft.
        Paste only that sanitized draft below. Do not attach raw logs, project paths,
        commands, source code or credentials. An observation is not a proven root cause;
        ordinary queue waiting and simulator boot timeouts alone are not memcap bugs.
  - type: textarea
    id: report
    attributes:
      label: Sanitized memcap report
      description: Generated by memcap report CATEGORY --dry-run.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Optional minimal reproduction
      description: Expected and observed behavior using a disposable example, with private details removed.
